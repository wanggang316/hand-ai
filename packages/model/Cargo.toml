[package]
name = "model"
version = "0.1.0"
edition = "2024"
description = "Unified multi-provider LLM API with model catalog, streaming, and cost tracking"
license = "MIT"
keywords = ["llm", "ai", "openai", "anthropic", "streaming"]
categories = ["api-bindings", "asynchronous"]

[features]
# Enables test-only constructors (e.g. `EventStream::with_default_provenance`).
# Defaulted on for now because no production caller takes a hit from it; we can
# strip it from the default set once consumers migrate to provenance-aware
# `EventStream::new`.
default = ["faux"]
faux = []

[[bin]]
name = "generate_models"
path = "src/generate_models.rs"

[[bin]]
name = "model-cli"
path = "src/bin/model_cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
async-stream = "0.3"
openai-rust = { git = "https://github.com/wanggang316/openai-rust", tag = "v0.1.0" }
google-genai-rust = { git = "https://github.com/wanggang316/google-genai-rust", tag = "v0.1.0" }
futures = "0.3"
chrono = "0.4"
dirs = "5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
thiserror = "1"
rand = "0.8"
base64 = "0.22"
urlencoding = "2"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
