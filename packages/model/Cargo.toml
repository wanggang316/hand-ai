[package]
name = "model"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "generate_models"
path = "src/bin/generate_models.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
openai-rust = { git = "https://github.com/wanggang316/openai-rust", tag = "v0.1.0" }
google-genai-rust = { git = "https://github.com/wanggang316/google-genai-rust", tag = "v0.1.0" }

