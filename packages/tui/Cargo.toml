[package]
name = "hand-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI component library with differential rendering"
license = "MIT"
keywords = ["tui", "terminal", "ui", "components"]
categories = ["command-line-interface"]

[dependencies]
crossterm = "0.28"
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
