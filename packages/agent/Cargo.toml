[package]
name = "hand-agent"
version = "0.1.0"
edition = "2024"
description = "Stateful AI agent runtime with tool execution and event streaming"
license = "MIT"
keywords = ["agent", "ai", "tool-calling", "llm"]
categories = ["asynchronous"]

[dependencies]
model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
thiserror = "2"
tracing = "0.1"
