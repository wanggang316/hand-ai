[package]
name = "hand-coding-agent"
version = "0.1.0"
edition = "2024"
description = "Interactive terminal coding agent with session management and built-in tools"
license = "MIT"
keywords = ["coding-agent", "ai", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hand"
path = "src/main.rs"

[dependencies]
model = { path = "../model" }
hand-agent = { path = "../agent" }
hand-tui = { path = "../tui" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
glob = "0.3"
similar = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
thiserror = "2"
chrono = "0.4"
regex-lite = "0.1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
