[package]
name = "model"
version = "0.1.0"
edition = "2024"
description = "Unified multi-provider LLM API with model catalog, streaming, and cost tracking"
license = "MIT"
keywords = ["llm", "ai", "openai", "anthropic", "streaming"]
categories = ["api-bindings", "asynchronous"]

[features]
# Enables test-only constructors (e.g. `EventStream::with_default_provenance`)
# and the in-memory `FauxProvider`/`FauxScriptStep` harness types. Off by
# default per Decision Log D-04 — production builds do not carry the mock
# helpers. Tests/harness consumers must opt in with `--features faux`.
default = []
faux = []

[[bin]]
name = "generate_models"
path = "src/generate_models.rs"

[[bin]]
name = "model-cli"
path = "src/bin/model_cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
async-stream = "0.3"
openai-rust = { git = "https://github.com/wanggang316/openai-rust", tag = "v0.2.1" }
google-genai-rust = { git = "https://github.com/wanggang316/google-genai-rust", tag = "v0.1.0" }
futures = "0.3"
chrono = "0.4"
dirs = "5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
thiserror = "2"
rand = "0.8"
base64 = "0.22"
urlencoding = "2"
tiny_http = "0.12"
# Reserved for the OpenAI Codex Responses WebSocket transport (M9 follow-up).
# Currently unused at the call site but pinned here so the surface lands
# in one place when the WebSocket transport is wired up.
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
# Self-dep so integration tests get the `faux` feature compiled in. Production
# builders that depend on `model` without the feature still won't pull in the
# mock helpers (Decision Log D-04). See parity_*.rs and utils_test.rs.
model = { path = ".", features = ["faux"] }
