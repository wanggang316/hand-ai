[package]
name = "hand-tui"
version.workspace = true
edition = "2024"
description = "Terminal UI component library with differential rendering"
license = "MIT"
keywords = ["tui", "terminal", "ui", "components"]
categories = ["command-line-interface"]

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
