[package]
name = "hand-tui"
version.workspace = true
edition = "2024"
description = "Terminal UI component library with differential rendering"
license = "MIT"
keywords = ["tui", "terminal", "ui", "components"]
categories = ["command-line-interface"]

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
base64 = "0.22"
# Decode/re-encode only: the Kitty graphics path transmits PNG (`f=100`), so a
# non-PNG source (jpeg/gif/webp) is transcoded to PNG before emission. Scoped to
# the four source formats we accept plus PNG output — no rayon, no avif, none of
# the heavy default-formats set. `image` 0.25 is already in the workspace lock
# (via arboard), so this pins to it without growing the dependency tree.
image = { version = "0.25", default-features = false, features = ["jpeg", "gif", "webp", "png"] }

[dev-dependencies]
libc = "0.2"
tempfile = "3"
# `test-util` (not part of `full`) enables tokio's paused clock so the frame
# scheduler's coalescing/rate-limit behaviour is tested deterministically
# without real wall-clock sleeps.
tokio = { version = "1", features = ["test-util"] }
