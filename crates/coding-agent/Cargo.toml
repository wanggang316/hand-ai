[package]
name = "hand-coding-agent"
version.workspace = true
edition = "2024"
description = "Interactive terminal coding agent with session management and built-in tools"
license = "MIT"
keywords = ["coding-agent", "ai", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hand"
path = "src/main.rs"

[dependencies]
model = { path = "../model" }
hand-agent = { path = "../agent" }
hand-tui = { path = "../tui" }
# The rt interactive driver renders through the rt stack's public API, whose
# types (Editor, Line, Rect, RtKey) are ratatui / crossterm types surfaced by
# hand-tui, so the driver names them directly. Versions pinned to match hand-tui.
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
crossterm = "0.29"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON object keys in insertion order, so session
# entries routed through `serde_json::Value` (the store envelope's
# payload) serialize byte-identically to the typed structs they came
# from — the on-disk JSONL format must not change shape.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
glob = "0.3"
ignore = "0.4"
similar = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
thiserror = "2"
chrono = "0.4"
regex-lite = "0.1"
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
toml = "0.8"
notify = "8"
tempfile = "3"
mime_guess = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
flate2 = "1"
tar = "0.4"
zip = { version = "5", default-features = false, features = ["deflate"] }
rand = "0.8"
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[features]
# On by default so the `hand` binary and existing embedders are
# unaffected. Turning it off drops rusqlite — and with it the
# `links = "sqlite3"` claim that cargo permits only once per dependency
# graph, which otherwise conflicts with an embedder's own sqlx / diesel
# / rusqlite. Session storage then only offers `SessionBackend::Jsonl`.
default = ["sqlite"]
sqlite = ["hand-agent/sqlite"]

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }

[dev-dependencies]
async-trait = "0.1"
ext-permission-gate = { path = "examples/extensions/permission-gate" }
