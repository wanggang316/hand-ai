[package]
name = "hand-coding-agent"
version = "0.1.1"
edition = "2024"
description = "Interactive terminal coding agent with session management and built-in tools"
license = "MIT"
keywords = ["coding-agent", "ai", "cli", "terminal"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "hand"
path = "src/main.rs"

[dependencies]
model = { path = "../model" }
hand-agent = { path = "../agent" }
hand-tui = { path = "../tui" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
glob = "0.3"
ignore = "0.4"
similar = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
thiserror = "2"
chrono = "0.4"
regex-lite = "0.1"
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
toml = "0.8"
notify = "8"
tempfile = "3"
mime_guess = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
flate2 = "1"
tar = "0.4"
zip = { version = "5", default-features = false, features = ["deflate"] }
rand = "0.8"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }

[dev-dependencies]
async-trait = "0.1"
ext-permission-gate = { path = "examples/extensions/permission-gate" }
