[package]
name = "ext-permission-gate"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
# Extensions hook the agent; none of them touch session storage, so
# they build against the sqlite-free surface — which also keeps this
# dev-dependency edge from pulling rusqlite back into the workspace.
hand-coding-agent = { path = "../../..", default-features = false }
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
serde_json = "1"
