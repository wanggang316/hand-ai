[package]
name = "ext-auto-commit-on-exit"
version.workspace = true
edition = "2024"
publish = false

[dependencies]
hand-coding-agent = { path = "../../.." }
async-trait = "0.1"
tokio = { version = "1", features = ["process", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "process"] }
tempfile = "3"
