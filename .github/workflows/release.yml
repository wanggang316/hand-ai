name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: hand-${{ github.ref_name }}-darwin-arm64.tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: hand-${{ github.ref_name }}-linux-x86_64.tar.gz
          # macOS Intel (`x86_64-apple-darwin`) intentionally dropped:
          # GitHub's `macos-13` Intel runners on the free tier
          # consistently queue past the 24h watchdog and get
          # auto-cancelled. The shipped pre-built binaries cover the
          # vast majority of users (macOS 2020+ is arm64; Linux x86_64
          # for servers/CI). Intel-macOS users can `cargo install
          # --git https://github.com/wanggang316/hand-ai hand-coding-agent`
          # to build from source.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin hand --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/hand

      - name: Package tarball
        run: |
          mkdir -p dist
          # Layout inside the tarball: hand-<version>/{hand,README.md,LICENSE}.
          # `tar -C` keeps the prefix clean — extractors land on a versioned
          # directory rather than scattering files into cwd.
          STAGE="$(mktemp -d)"
          PKG="hand-${GITHUB_REF_NAME}"
          mkdir -p "$STAGE/$PKG"
          cp target/${{ matrix.target }}/release/hand "$STAGE/$PKG/"
          cp README.md "$STAGE/$PKG/" 2>/dev/null || true
          cp LICENSE "$STAGE/$PKG/" 2>/dev/null || true
          tar -C "$STAGE" -czf "dist/${{ matrix.asset }}" "$PKG"
          ls -la dist/

      - name: Generate SHA-256 checksum
        run: |
          cd dist
          if command -v shasum >/dev/null; then
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          cat "${{ matrix.asset }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the previous tag resolves for the
          # "Full changelog" compare link in the release notes.
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -la dist/

      - name: Stage install.sh for upload
        # Copy the canonical install script into dist/ so the release
        # publishing step picks it up alongside the tarballs. Users can
        # then `curl -sSL .../releases/latest/download/install.sh | sh`
        # without needing to know the repo layout.
        run: cp scripts/install.sh dist/install.sh

      - name: Extract release notes from CHANGELOG
        # The release body is the CHANGELOG section for this version —
        # the curated user-facing summary — not an auto-generated PR
        # list. Extract everything between `## [X.Y.Z]` and the next
        # version header. An empty section fails the release: a version
        # without CHANGELOG content is a process error to fix before
        # tagging, not something to paper over.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { f = 1; next }
            /^## \[/ { f = 0 }
            f
          ' CHANGELOG.md > release-notes.md
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$PREV_TAG" "$GITHUB_REF_NAME" >> release-notes.md
          fi
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The tag itself (`v0.1.0` etc.) is implicit from the trigger.
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/hand-*.tar.gz
            dist/hand-*.tar.gz.sha256
            dist/install.sh
          fail_on_unmatched_files: true
