name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --features model/faux

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features model/faux
      - run: cargo test -p hand-agent --features sqlite

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features model/faux -- -D warnings
      - run: cargo clippy -p hand-agent --all-targets --features sqlite -- -D warnings

  # The sqlite-free build embedders rely on. `hand-coding-agent` enables
  # the sqlite backend by default, so nothing above this job ever compiles
  # the `#[cfg(not(feature = "sqlite"))]` paths — a missing cfg only
  # surfaces in a downstream build.
  no-sqlite:
    name: Sqlite-free build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p hand-coding-agent --no-default-features --all-targets -- -D warnings
      - run: cargo test -p hand-coding-agent --no-default-features
      # rusqlite claims `links = "sqlite3"`, which cargo permits once per
      # dependency graph. If it reaches this build the crate is unusable
      # alongside an embedder's own sqlx / diesel, so assert the graph
      # directly: a manifest can re-enable the feature unconditionally
      # without breaking any compile above.
      - name: Assert no rusqlite in the sqlite-free graph
        run: |
          if cargo tree -p hand-coding-agent --no-default-features \
             | grep -E 'rusqlite|libsqlite3-sys'; then
            echo "::error::--no-default-features pulled in rusqlite; something enables the sqlite feature unconditionally"
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Integration tests (requires API keys, run manually)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -- --ignored
        env:
          RUN_INTEGRATION_TESTS: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
