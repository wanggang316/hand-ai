[workspace]
members = [
    "crates/model",
    "crates/agent",
    "crates/tui",
    "crates/coding-agent",
    "crates/web-ui",
    "examples",
    "crates/coding-agent/examples/extensions/permission-gate",
    "crates/coding-agent/examples/extensions/dirty-repo-guard",
    "crates/coding-agent/examples/extensions/auto-commit-on-exit",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
rust-version = "1.88"
